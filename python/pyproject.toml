[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sw_pll"
version = "2.6.0"
dependencies = [
    "numpy==2.2.*",
    "matplotlib==3.10.*",
    "soundfile==0.14.*",
    "scipy==1.15.*",
]

[tool.setuptools]
packages = ["sw_pll"]
package-dir = {"" = "."}